spring.application.name=ccp-speech-to-text

openai.api.key=${OPENAI_API_KEY:}
openai.api.base-url=${OPENAI_API_BASE_URL:https://api.openai.com/v1}
openai.api.model=gpt-4o-mini-transcribe

# Blocking cloud I/O runs on lightweight Java 21 virtual threads.
spring.threads.virtual.enabled=true
spring.main.keep-alive=true

# Allow in-flight requests to finish when the administration API closes Spring.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# Match the transcription API's maximum upload size.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Do not expose internal exception details to clients.
server.error.include-message=never
server.error.include-stacktrace=never
